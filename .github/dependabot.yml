version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Mayores bloqueadas hasta que el ecosistema las soporte (las peer deps rompen `npm ci`).
    # Quitar la entrada cuando se haga la migración a mano.
    ignore:
      # typescript-eslint exige typescript <6.1
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # eslint-plugin-jsx-a11y no soporta ESLint 10
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: '@eslint/js'
        update-types: [version-update:semver-major]
      # Los tipos deben seguir al runtime (Node 24, .nvmrc)
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
